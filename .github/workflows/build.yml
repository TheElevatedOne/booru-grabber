# Builds booru-grabber on Arch Linux, runs the unit tests and packages the /usr release tarball and the
# portable directory. The AppImage is built on Ubuntu 24.04 so it runs on older distributions.
# Pushing a tag such as 1.0.0 also publishes a GitHub release with these files; the booru-grabber-bin
# AUR package downloads the tarball. The release notes are the tag's section in CHANGELOG.md.
name: Build

on:
  push:
    branches: [master]
    tags: ["[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (Arch Linux x86_64)
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git cmake ninja gtk3 libsoup3 libxml2 sqlite gdk-pixbuf2 nlohmann-json \
            quickjs-ng typescript gstreamer gst-plugins-base-libs libayatana-appindicator catch2 \
            desktop-file-utils appstream

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^project(booru-grabber VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the project version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DBOORU_GRABBER_FETCH_QUICKJS=OFF
          cmake --build build

      - name: Test
        run: |
          ./build/bin/booru-grabber --version
          ./build/bin/booru-grabber-cli --version
          ./build/bin/booru-grabber-cli --profile "$RUNNER_TEMP/profile" --list-sites
          ctest --test-dir build --output-on-failure
          desktop-file-validate data/io.github.TheElevatedOne.BooruGrabber.desktop
          appstreamcli validate --no-net --pedantic data/io.github.TheElevatedOne.BooruGrabber.metainfo.xml

      - name: Package
        run: |
          packaging/make-release-tarball.sh build "${{ steps.version.outputs.version }}" x86_64
          packaging/make-portable.sh "${{ steps.version.outputs.version }}" x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: booru-grabber-linux-x86_64
          path: dist/*
          if-no-files-found: error

  appimage:
    name: AppImage (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ git curl file pkg-config \
            libgtk-3-dev libsoup-3.0-dev libxml2-dev libsqlite3-dev nlohmann-json3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libayatana-appindicator3-dev \
            librsvg2-common nodejs npm
          sudo npm install -g typescript@5.9.3

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # quickjs-ng is not packaged on Ubuntu, so CMake downloads and builds it (BOORU_GRABBER_FETCH_QUICKJS)
      - name: Build AppImage
        run: |
          version=$(sed -n 's/^project(booru-grabber VERSION \([^ )]*\).*/\1/p' CMakeLists.txt)
          packaging/build-appimage.sh "$version" x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: booru-grabber-appimage-x86_64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, appimage]
    # A failed AppImage build does not hold back the tarballs
    if: github.ref_type == 'tag' && !cancelled() && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: booru-grabber-*
          path: dist
          merge-multiple: true

      - name: Release notes
        run: |
          # The lines between "## <tag>" and the next "## " heading.
          awk -v v="$GITHUB_REF_NAME" '
            /^## / { if (found) exit; if ($0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## $GITHUB_REF_NAME\" section"
            exit 1
          fi
          cat release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Booru Grabber $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
