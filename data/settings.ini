; System-wide defaults for Booru Grabber.
;
; Installed as /etc/booru-grabber/settings.ini (or <prefix>/etc/booru-grabber/settings.ini).
; Values here apply to every user; each user's own settings in
; $XDG_CONFIG_HOME/booru-grabber/settings.ini (~/.config/booru-grabber/settings.ini) take precedence.
; The format is the INI dialect of the original Grabber: [General] holds top-level keys, other
; sections hold "Section/key" settings, and nested keys use a backslash (e.g. Customs\artist).

[General]
; Sites selected in new search tabs
sites=safebooru.org
; Images per page and API order (Xml, Json, Regex = HTML, Rss)
limit=20
source_1=xml
source_2=json
source_3=regex
source_4=rss
; Hide images matching the blacklist instead of only marking them
hideblacklisted=false
; Restore the previous tabs on start
start=restore

[Save]
; Download folder; empty means $XDG_PICTURES_DIR/Booru Grabber
path=
filename=%md5%.%ext%
simultaneous=1
downloadoriginals=true
samplefallback=true
keepDate=true
headerDetection=true
md5Duplicates=save
md5DuplicatesSameDir=save
separator=" "

[Monitoring]
enableTray=false
